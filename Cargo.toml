[package]
name = "semulate"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "NES emulator built in Rust"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["desktop"]
desktop = []
web = []

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]